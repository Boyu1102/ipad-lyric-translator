name: LyricBridge
options:
  bundleIdPrefix: app.lyricbridge
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    CURRENT_PROJECT_VERSION: '3'
    MARKETING_VERSION: 0.3.0
    CODE_SIGN_STYLE: Automatic
targets:
  LyricBridge:
    type: application
    platform: iOS
    sources:
    - LyricBridgeApp.swift
    - LyricModel.swift
    - MusicMonitor.swift
    - LyricsTimeline.swift
    - LyricsService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lyricbridge.personal
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 歌词译伴
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleMusicUsageDescription: 读取 Apple Music 当前歌曲和播放进度以同步翻译歌词；不会录屏或录音。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
schemes:
  LyricBridge:
    build:
      targets:
        LyricBridge: all
