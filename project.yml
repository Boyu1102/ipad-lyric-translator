name: LyricBridge
options:
  bundleIdPrefix: app.lyricbridge
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    CURRENT_PROJECT_VERSION: '2'
    MARKETING_VERSION: 0.2.0
    CODE_SIGN_STYLE: Automatic
targets:
  LyricBridge:
    type: application
    platform: iOS
    sources:
    - LyricBridgeApp.swift
    - LyricModel.swift
    - VisualCapture.swift
    - Wire.swift
    - SentenceSelection.swift
    - FrameProcessor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lyricbridge.personal
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 歌词译伴
        NSScreenCaptureUsageDescription: 读取你允许的歌词画面，用于本机日语识别和翻译。
        UIBackgroundModes:
        - screen-capture
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Generated/LyricBridge.entitlements
      properties:
        com.apple.developer.screen-recording: true
schemes:
  LyricBridge:
    build:
      targets:
        LyricBridge: all
