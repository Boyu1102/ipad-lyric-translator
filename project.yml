name: LyricBridge
options:
  bundleIdPrefix: app.lyricbridge
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
    CODE_SIGN_STYLE: Automatic
targets:
  LyricBridge:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lyricbridge.personal
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 歌词译伴
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: Broadcast
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lyricbridge.personal.broadcast
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
    info:
      path: Generated/Broadcast-Info.plist
      properties:
        CFBundleDisplayName: 歌词译伴识别
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
schemes:
  LyricBridge:
    build:
      targets:
        LyricBridge: all
