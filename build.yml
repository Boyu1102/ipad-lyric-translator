name: Build iPad app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project and build
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project LyricBridge.xcodeproj -scheme LyricBridge \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/LyricBridge.app package/Payload/
          cd package
          zip -qry ../LyricBridge-unsigned.ipa Payload
      - name: Downloadable app
        uses: actions/upload-artifact@v4
        with:
          name: LyricBridge-unsigned
          path: LyricBridge-unsigned.ipa
          retention-days: 7
