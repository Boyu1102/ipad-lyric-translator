name: Build iPad app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify sentence selection
        run: |
          set -euo pipefail
          if [ -f Shared/SentenceSelection.swift ]; then
            swiftc Shared/SentenceSelection.swift Tests/main.swift -o /tmp/lyric-tests
          else
            swiftc SentenceSelection.swift main.swift -o /tmp/lyric-tests
          fi
          /tmp/lyric-tests
      - name: Install project generator
        run: brew install xcodegen
      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodegen generate
          xcodebuild -project LyricBridge.xcodeproj -scheme LyricBridge \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/LyricBridge.app package/Payload/
          cd package
          zip -qry ../LyricBridge-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LyricBridge-v2-visual
          path: LyricBridge-unsigned.ipa
          retention-days: 7
